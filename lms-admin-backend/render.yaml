services:
  - type: web
    name: IJED-HCJ-1
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard — never commit real credentials
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://ijedlms.vercel.app http://localhost:5500 http://127.0.0.1:5500 http://localhost:5501 http://127.0.0.1:5501"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"